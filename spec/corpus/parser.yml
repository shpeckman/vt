# spec/corpus/parser.yml

# ==============================================================================
# GROUND STATE & BASIC CHARACTERS
# ==============================================================================

- name: "Standard text and execution"
  input: "AB\n"
  expected:
    - ["print", 65]
    - ["print", 66]
    - ["execute", 10]

- name: "C0 control characters trigger execute in ground state"
  input: "\u0000\u0007\u0008\u0009\u000A\u000B\u000C\u000D"
  expected:
    - ["execute", 0]
    - ["execute", 7]
    - ["execute", 8]
    - ["execute", 9]
    - ["execute", 10]
    - ["execute", 11]
    - ["execute", 12]
    - ["execute", 13]

- name: "C1 control characters (8-bit) are treated as printable text"
  input: "\u0080\u0090\u009B\u009F"
  expected:
    - ["print", 128]
    - ["print", 144]
    - ["print", 155]
    - ["print", 159]

- name: "DEL (0x7F) is ignored in ground state"
  input: "A\u007FB"
  expected:
    - ["print", 65]
    - ["print", 127]
    - ["print", 66]

# ==============================================================================
# ESCAPE (ESC) STATE
# ==============================================================================

- name: "Simple ESC dispatch (e.g. RIS)"
  input: "\u001bc"
  expected:
    - ["clear"]
    - ["esc_dispatch", 99, [], false]

- name: "ESC dispatch with intermediate (e.g. Designate G0 Character Set)"
  input: "\u001b(B"
  expected:
    - ["clear"]
    - ["collect", 40]
    - ["esc_dispatch", 66, [40], false]

- name: "ESC dispatch with multiple intermediates"
  input: "\u001b!\"#0"
  expected:
    - ["clear"]
    - ["collect", 33]
    - ["collect", 34]
    - ["collect", 35]
    - ["esc_dispatch", 48, [33, 34, 35], false]

- name: "DEL (0x7F) is ignored during ESC state"
  input: "\u001b\u007fc"
  expected:
    - ["clear"]
    - ["esc_dispatch", 99, [], false]

- name: "C0 controls execute without interrupting ESC state"
  input: "\u001b\u0007c"
  expected:
    - ["clear"]
    - ["execute", 7]
    - ["esc_dispatch", 99, [], false]

# ==============================================================================
# CSI STATE
# ==============================================================================

- name: "Simple CSI with no parameters"
  input: "\u001b[m"
  expected:
    - ["clear"]
    - ["csi_dispatch", 109, [], [], false]

- name: "Simple CSI (SGR color change)"
  input: "\u001b[31m"
  expected:
    - ["clear"]
    - ["param", 51]
    - ["param", 49]
    - ["csi_dispatch", 109, [[31, false]], [], false]

- name: "CSI with multiple parameters"
  input: "\u001b[38;5;255m"
  expected:
    - ["clear"]
    - ["param", 51]
    - ["param", 56]
    - ["param", 59]
    - ["param", 53]
    - ["param", 59]
    - ["param", 50]
    - ["param", 53]
    - ["param", 53]
    - ["csi_dispatch", 109, [[38, false], [5, false], [255, false]], [], false]

- name: "CSI with sub-parameters"
  input: "\u001b[38:2:255:0:100m"
  expected:
    - ["clear"]
    - ["param", 51]
    - ["param", 56]
    - ["param", 58]
    - ["param", 50]
    - ["param", 58]
    - ["param", 50]
    - ["param", 53]
    - ["param", 53]
    - ["param", 58]
    - ["param", 48]
    - ["param", 58]
    - ["param", 49]
    - ["param", 48]
    - ["param", 48]
    - ["csi_dispatch", 109, [[38, false], [2, true], [255, true], [0, true], [100, true]], [], false]

- name: "CSI with omitted parameters sets value to -1"
  input: "\u001b[;1;;m"
  expected:
    - ["clear"]
    - ["param", 59]
    - ["param", 49]
    - ["param", 59]
    - ["param", 59]
    - ["csi_dispatch", 109, [[-1, false], [1, false], [-1, false], [-1, false]], [], false]

- name: "CSI with implicit trailing parameter"
  input: "\u001b[1;m"
  expected:
    - ["clear"]
    - ["param", 49]
    - ["param", 59]
    - ["csi_dispatch", 109, [[1, false], [-1, false]], [], false]

- name: "CSI with leading and trailing sub-parameters"
  input: "\u001b[:1:m"
  expected:
    - ["clear"]
    - ["param", 58]
    - ["param", 49]
    - ["param", 58]
    - ["csi_dispatch", 109, [[-1, false], [1, true], [-1, true]], [], false]

- name: "CSI with intermediate characters"
  input: "\u001b[?25h"
  expected:
    - ["clear"]
    - ["collect", 63]
    - ["param", 50]
    - ["param", 53]
    - ["csi_dispatch", 104, [[25, false]], [63], false]

- name: "CSI with multiple intermediate characters"
  input: "\u001b[?25+!h"
  expected:
    - ["clear"]
    - ["collect", 63]
    - ["param", 50]
    - ["param", 53]
    - ["collect", 43]
    - ["collect", 33]
    - ["csi_dispatch", 104, [[25, false]], [63, 43, 33], false]

- name: "CSI parameter integer overflow clamped to Int32::MAX"
  input: "\u001b[9999999999999m"
  expected:
    - ["clear"]
    - ["param", 57]
    - ["param", 57]
    - ["param", 57]
    - ["param", 57]
    - ["param", 57]
    - ["param", 57]
    - ["param", 57]
    - ["param", 57]
    - ["param", 57]
    - ["param", 57]
    - ["param", 57]
    - ["param", 57]
    - ["param", 57]
    - ["csi_dispatch", 109, [[2147483647, false]], [], false]

- name: "CSI sequence drops invalid transition characters and enters ignored state"
  input: "\u001b[1<m"
  expected:
    - ["clear"]
    - ["param", 49]

- name: "Interrupt CSI with C0 control (BEL) executes and continues"
  input: "\u001b[3\u00071m"
  expected:
    - ["clear"]
    - ["param", 51]
    - ["execute", 7]
    - ["param", 49]
    - ["csi_dispatch", 109, [[31, false]], [], false]

- name: "DEL characters are ignored in CSI"
  input: "\u001b[3\u007f1m"
  expected:
    - ["clear"]
    - ["param", 51]
    - ["param", 49]
    - ["csi_dispatch", 109, [[31, false]], [], false]

