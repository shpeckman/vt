# ==============================================================================
# DCS STATE
# ==============================================================================

- name: "DCS string pass-through with no parameters"
  input: "\u001bPqData\u001b\\"
  expected:
    - ["clear"]
    - ["hook", 113, [], [], false]
    - ["put", 68]
    - ["put", 97]
    - ["put", 116]
    - ["put", 97]
    - ["unhook"]
    - ["clear"]
    - ["esc_dispatch", 92, [], false]

- name: "DCS string pass-through with parameters"
  input: "\u001bP1;2qData\u001b\\"
  expected:
    - ["clear"]
    - ["param", 49]
    - ["param", 59]
    - ["param", 50]
    - ["hook", 113, [[1, false], [2, false]], [], false]
    - ["put", 68]
    - ["put", 97]
    - ["put", 116]
    - ["put", 97]
    - ["unhook"]
    - ["clear"]
    - ["esc_dispatch", 92, [], false]

- name: "DCS entry with invalid parameter characters enters ignored state"
  input: "\u001bP1<qData\u001b\\"
  expected:
    - ["clear"]
    - ["param", 49]
    - ["clear"]
    - ["esc_dispatch", 92, [], false]

- name: "DEL (0x7F) is ignored during DCS pass-through"
  input: "\u001bPqD\u007fa\u001b\\"
  expected:
    - ["clear"]
    - ["hook", 113, [], [], false]
    - ["put", 68]
    - ["put", 97]
    - ["unhook"]
    - ["clear"]
    - ["esc_dispatch", 92, [], false]

- name: "C0 controls are put during DCS pass-through"
  input: "\u001bPqD\u0007a\u001b\\"
  expected:
    - ["clear"]
    - ["hook", 113, [], [], false]
    - ["put", 68]
    - ["put", 7]
    - ["put", 97]
    - ["unhook"]
    - ["clear"]
    - ["esc_dispatch", 92, [], false]

- name: "C0 controls are ignored during DCS parameter parsing"
  input: "\u001bP1\u0007;2qA\u001b\\"
  expected:
    - ["clear"]
    - ["param", 49]
    - ["param", 59]
    - ["param", 50]
    - ["hook", 113, [[1, false], [2, false]], [], false]
    - ["put", 65]
    - ["unhook"]
    - ["clear"]
    - ["esc_dispatch", 92, [], false]

# ==============================================================================
# OSC STATE
# ==============================================================================

- name: "OSC string terminated by BEL"
  input: "\u001b]0;Title\u0007"
  expected:
    - ["clear"]
    - ["osc_start"]
    - ["osc_put", 48]
    - ["osc_put", 59]
    - ["osc_put", 84]
    - ["osc_put", 105]
    - ["osc_put", 116]
    - ["osc_put", 108]
    - ["osc_put", 101]
    - ["osc_end"]

- name: "OSC string terminated by ST (ESC \\)"
  input: "\u001b]0;Title\u001b\\"
  expected:
    - ["clear"]
    - ["osc_start"]
    - ["osc_put", 48]
    - ["osc_put", 59]
    - ["osc_put", 84]
    - ["osc_put", 105]
    - ["osc_put", 116]
    - ["osc_put", 108]
    - ["osc_put", 101]
    - ["osc_end"]
    - ["clear"]
    - ["esc_dispatch", 92, [], false]

- name: "C0 controls (except BEL) are ignored during OSC"
  input: "\u001b]0;T\u0009itle\u0007"
  expected:
    - ["clear"]
    - ["osc_start"]
    - ["osc_put", 48]
    - ["osc_put", 59]
    - ["osc_put", 84]
    - ["osc_put", 105]
    - ["osc_put", 116]
    - ["osc_put", 108]
    - ["osc_put", 101]
    - ["osc_end"]

- name: "DEL (0x7F) is put during OSC"
  input: "\u001b]0;T\u007fitle\u0007"
  expected:
    - ["clear"]
    - ["osc_start"]
    - ["osc_put", 48]
    - ["osc_put", 59]
    - ["osc_put", 84]
    - ["osc_put", 127]
    - ["osc_put", 105]
    - ["osc_put", 116]
    - ["osc_put", 108]
    - ["osc_put", 101]
    - ["osc_end"]

# ==============================================================================
# SOS / PM / APC STATES
# ==============================================================================

- name: "SOS string pass-through terminated by ST"
  input: "\u001bXtest\u001b\\"
  expected:
    - ["clear"]
    - ["sos_start"]
    - ["sos_put", 116]
    - ["sos_put", 101]
    - ["sos_put", 115]
    - ["sos_put", 116]
    - ["sos_end"]
    - ["clear"]
    - ["esc_dispatch", 92, [], false]

- name: "PM string pass-through terminated by ST"
  input: "\u001b^test\u001b\\"
  expected:
    - ["clear"]
    - ["pm_start"]
    - ["pm_put", 116]
    - ["pm_put", 101]
    - ["pm_put", 115]
    - ["pm_put", 116]
    - ["pm_end"]
    - ["clear"]
    - ["esc_dispatch", 92, [], false]

- name: "APC string pass-through terminated by ST"
  input: "\u001b_test\u001b\\"
  expected:
    - ["clear"]
    - ["apc_start"]
    - ["apc_put", 116]
    - ["apc_put", 101]
    - ["apc_put", 115]
    - ["apc_put", 116]
    - ["apc_end"]
    - ["clear"]
    - ["esc_dispatch", 92, [], false]

# ==============================================================================
# GLOBAL INTERRUPTS (CAN, SUB, ESC)
# ==============================================================================

- name: "Interrupt CSI with CAN aborts and returns to ground"
  input: "\u001b[3\u0018"
  expected:
    - ["clear"]
    - ["param", 51]
    - ["execute", 24]

- name: "Interrupt CSI with SUB aborts and returns to ground"
  input: "\u001b[3\u001a"
  expected:
    - ["clear"]
    - ["param", 51]
    - ["execute", 26]

- name: "Interrupt DCS with CAN unhooks early and returns to ground"
  input: "\u001bPqDat\u0018"
  expected:
    - ["clear"]
    - ["hook", 113, [], [], false]
    - ["put", 68]
    - ["put", 97]
    - ["put", 116]
    - ["unhook"]
    - ["execute", 24]

- name: "Interrupt OSC with CAN ends string early and returns to ground"
  input: "\u001b]0;Tit\u0018"
  expected:
    - ["clear"]
    - ["osc_start"]
    - ["osc_put", 48]
    - ["osc_put", 59]
    - ["osc_put", 84]
    - ["osc_put", 105]
    - ["osc_put", 116]
    - ["osc_end"]
    - ["execute", 24]

- name: "ESC interrupts ESC and resets state machine"
  input: "\u001b\u001b[m"
  expected:
    - ["clear"]
    - ["clear"]
    - ["csi_dispatch", 109, [], [], false]

- name: "ESC interrupts CSI and resets state machine"
  input: "\u001b[31\u001b[m"
  expected:
    - ["clear"]
    - ["param", 51]
    - ["param", 49]
    - ["clear"]
    - ["csi_dispatch", 109, [], [], false]

- name: "ESC interrupts OSC, triggers osc_end, and starts new ESC sequence"
  input: "\u001b]0;Tit\u001b[m"
  expected:
    - ["clear"]
    - ["osc_start"]
    - ["osc_put", 48]
    - ["osc_put", 59]
    - ["osc_put", 84]
    - ["osc_put", 105]
    - ["osc_put", 116]
    - ["osc_end"]
    - ["clear"]
    - ["csi_dispatch", 109, [], [], false]

